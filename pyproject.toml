[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "densweep"
version = "1.0.0"
description = "Automatic parameter selection for density-based clustering (HDBSCAN/DBSCAN) via a smart early-stopper. From-scratch NumPy, optional GPU."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Rafał Maciejewski" }, { name = "Robert Kłopotek" }]
keywords = ["clustering", "hdbscan", "dbscan", "hyperparameter", "early-stopping", "gpu"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.22",
]

[project.optional-dependencies]
# GPU acceleration: pick the wheel matching your CUDA toolkit, e.g. cupy-cuda12x.
gpu = ["cupy-cuda12x>=12.0"]
# Everything needed to run the test-suite and examples (cross-checks vs sklearn).
dev = ["pytest>=7.0", "scikit-learn>=1.3", "scipy>=1.9"]

[project.urls]
Homepage = "https://github.com/rmaciejewski/densweep"
Repository = "https://github.com/rmaciejewski/densweep"

[tool.setuptools]
packages = ["densweep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
